<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Contacto - Bolívar Clean</title>

<style>
body {
    margin: 0;
    padding: 25px;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #dffff9, #a1f5ec);
    color: #164b70;
    text-align: center;
}

h1 {
    color: #087e9b;
    font-size: 32px;
}

.subtitulo {
    font-size: 17px;
}

.tarjeta {
    background: white;
    padding: 25px;
    margin: 25px auto;
    max-width: 500px;
    border-radius: 20px;
    border: 2px solid #32cfc4;
    box-shadow: 0 5px 15px #75cfc5;
}

.dato {
    background: #e7fffb;
    padding: 15px;
    margin: 15px 0;
    border-radius: 12px;
    border: 1px solid #9ce9df;
    font-size: 16px;
}

h2 {
    color: #0787a5;
}

p {
    line-height: 1.7;
}
</style>
</head>

<body>

<h1>Contáctanos</h1>

<p class="subtitulo">
Estamos aquí para atenderte.
</p>

<div class="tarjeta">

    <h2>Bolívar Clean</h2>

    <p>
    Empresa estudiantil de productos químicos
    y artículos de limpieza.
    </p>

    <div class="dato">
        Unidad Educativa Fiscal Técnico
        Provincia de Bolívar
    </div>

    <div class="dato">
        Productos de limpieza
    </div>

    <div class="dato">
        Atención y compromiso
    </div>

    <p>
    Gracias por confiar en nuestro emprendimiento.
    </p>

</div>

</body>
</html>
