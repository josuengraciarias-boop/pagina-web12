<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Encabezado Bolívar Clean</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg, #b2fff5, #16dcca);
    color: #075985;
}

.encabezado {
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    padding: 15px;
    background: linear-gradient(120deg, #b2fff5, #16dcca);
    border-bottom: 3px solid #0787a5;
}

.logo {
    width: 110px;
    height: 110px;
    object-fit: contain;
    background: white;
    border-radius: 50%;
    padding: 5px;
}

.texto {
    text-align: center;
}

h1 {
    font-size: 30px;
    margin: 0 0 12px;
    color: #075985;
}

h2 {
    font-size: 19px;
    margin: 0;
    color: #087e9b;
    font-weight: normal;
}

p {
    font-size: 15px;
    margin: 8px 0 0;
    color: #164b70;
}

@media (max-width: 600px) {
    .encabezado {
        gap: 12px;
        padding: 10px;
    }

    .logo {
        width: 70px;
        height: 70px;
    }

    h1 {
        font-size: 20px;
    }

    h2 {
        font-size: 15px;
    }

    p {
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div class="encabezado">

    <img src="./logo.jpg"
         alt="Logo del Colegio Provincia de Bolívar"
         class="logo">

    <div class="texto">
        <h1>QUÍMICOS PROVINCIA DE BOLÍVAR</h1>
        <h2>Empresa de productos químicos</h2>
        <p>Calidad, innovación y compromiso</p>
    </div>

</div>

</body>
</html>
