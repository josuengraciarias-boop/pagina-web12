<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos - Bolívar Clean</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5ffff;
            color: #164b70;
            text-align: center;
            margin: 20px;
        }

        h1 {
            color: #075985;
        }

        table {
            width: 95%;
            margin: 20px auto;
            border-collapse: collapse;
            font-size: 16px;
        }

        th {
            background: linear-gradient(90deg, #075985, #078bb5);
            color: white;
            padding: 15px 5px;
        }

        td {
            border: 1px solid #2585a5;
            padding: 10px 5px;
            height: 100px;
        }

        tr:hover {
            background-color: #d9fff9;
        }

        .producto {
            width: 75px;
            height: 85px;
            object-fit: contain;
        }

        p {
            font-size: 17px;
        }
    </style>
</head>

<body>

    <h1>Productos químicos</h1>

    <p>Productos de limpieza elaborados para la institución</p>

    <table>
        <tr>
            <th>N.º</th>
            <th>Curso</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Imagen</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Primero de Bachillerato</td>
            <td>Cloro</td>
            <td>$3.50</td>
            <td>
                <img src="cloro.png"
                     class="producto"
                     alt="Cloro">
            </td>
        </tr>

        <tr>
            <td>2</td>
            <td>Segundo de Bachillerato</td>
            <td>Desinfectante</td>
            <td>$4.50</td>
            <td>
                <img src="desinfectante.png"
                     class="producto"
                     alt="Desinfectante">
            </td>
        </tr>

        <tr>
            <td>3</td>
            <td>Tercero de Bachillerato</td>
            <td>Jabón líquido</td>
            <td>$5.00</td>
            <td>
                <img src="jabon.png"
                     class="producto"
                     alt="Jabón líquido">
            </td>
        </tr>
    </table>

    <p>Productos de calidad para la limpieza de la institución.</p>

</body>
</html>
